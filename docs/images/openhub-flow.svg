<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OpenHub unified AI model access flow</title>
  <desc id="desc">An application connects to OpenHub, which discovers and adapts models from multiple New API sites and their upstream providers.</desc>
  <defs>
    <linearGradient id="hub" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="7" refY="4" viewBox="0 0 8 8">
      <path d="M0 0L8 4L0 8Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#f8fafc"/>
  <text x="60" y="58" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">OpenHub：一个入口，接入多个 AI 模型站点</text>
  <text x="60" y="88" fill="#64748b" font-family="Arial, sans-serif" font-size="16">发现模型 · 补全参数 · 核验能力 · 统一调用</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="210" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="165" y="196" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="21" font-weight="700">你的网站 / 软件</text>
    <text x="165" y="232" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">聊天 · 绘图 · 音频 · 视频</text>
    <text x="165" y="268" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="15">只接 OpenHub</text>
  </g>

  <path d="M270 225H360" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="360" y="125" width="290" height="200" rx="22" fill="url(#hub)"/>
    <text x="505" y="177" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">OpenHub</text>
    <text x="505" y="216" text-anchor="middle" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="16">统一入口与适配层</text>
    <text x="505" y="252" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">模型发现 · 目录匹配 · Schema</text>
    <text x="505" y="279" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">适配器 · Variant · 状态核验</text>
  </g>

  <path d="M650 225H740" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="740" y="150" width="190" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="835" y="196" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="21" font-weight="700">New API 站点</text>
    <text x="835" y="232" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16">地址 + Key</text>
    <text x="835" y="268" text-anchor="middle" fill="#16a34a" font-family="Arial, sans-serif" font-size="15">自动发现模型</text>
  </g>

  <path d="M930 225H1000" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1000" y="150" width="140" height="150" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1070" y="192" text-anchor="middle" fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="700">上游供应商</text>
    <text x="1070" y="226" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">OpenAI</text>
    <text x="1070" y="250" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">Google</text>
    <text x="1070" y="274" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="14">更多供应商</text>
  </g>

  <text x="600" y="382" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="15">目录提供线索，真实契约与验证结果决定能否调用</text>
</svg>
