name: OpenHub CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @openhub/server test:adapters
      - run: pnpm --filter @openhub/server adapter-index:check
      - run: pnpm --filter @openhub/web build
